name: Build Debug APK & Publish Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install web dependencies & sync Capacitor Android
        run: |
          npm install --no-audit --no-fund
          npm run build
          npx cap sync android

      - name: Set up Temurin Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Verify Java environment
        run: |
          set -euo pipefail
          echo "JAVA_HOME=${JAVA_HOME:-}"
          if [ -z "${JAVA_HOME:-}" ]; then
            echo "::error::JAVA_HOME is not set."
            exit 1
          fi

          JAVA_VER_OUTPUT="$(java -version 2>&1)"
          echo "$JAVA_VER_OUTPUT"

          RAW_VERSION="$(printf '%s\n' "$JAVA_VER_OUTPUT" | head -n 1 | sed -nE 's/.*version "([^"]+)".*/\1/p')"
          if [ -z "$RAW_VERSION" ]; then
            echo "::error::Unable to detect active Java version."
            exit 1
          fi

          MAJOR_VERSION="${RAW_VERSION%%.*}"
          if [ "$MAJOR_VERSION" = "1" ]; then
            MAJOR_VERSION="$(printf '%s' "$RAW_VERSION" | cut -d. -f2)"
          fi
          MAJOR_VERSION="${MAJOR_VERSION%%[^0-9]*}"

          if [ -z "$MAJOR_VERSION" ]; then
            echo "::error::Unable to parse active Java major version from '$RAW_VERSION'."
            exit 1
          fi

          echo "Detected Java major version: $MAJOR_VERSION"
          if [ "$MAJOR_VERSION" -lt 21 ]; then
            echo "::error::Java 21 or newer is required by Capacitor Android (detected Java $MAJOR_VERSION)."
            exit 1
          fi

      - name: Set up Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Create temporary debug keystore
        working-directory: android
        run: |
          set -euo pipefail
          KEYTOOL_BIN="${JAVA_HOME}/bin/keytool"
          if [ ! -x "$KEYTOOL_BIN" ]; then
            echo "::error::keytool not found in JAVA_HOME/bin."
            exit 1
          fi

          if [ ! -f ./debug.keystore ]; then
            "$KEYTOOL_BIN" -genkeypair \
              -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 >/dev/null 2>&1
          fi

          if [ ! -f ./debug.keystore ]; then
            echo "::error::Failed to create ./debug.keystore."
            exit 1
          fi
          echo "Temporary debug keystore verified."

      - name: Build debug APK
        working-directory: android
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          set -euo pipefail
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -e "$APK_PATH" ]; then
            echo "::error::Expected debug APK not found at $APK_PATH"
            if [ -d "android/app/build/outputs/apk" ]; then
              echo "Discovered files under android/app/build/outputs/apk:"
              find android/app/build/outputs/apk -type f -name '*.apk' || true
            fi
            exit 1
          fi

          if [ ! -f "$APK_PATH" ] || [ ! -s "$APK_PATH" ]; then
            echo "::error::$APK_PATH is not a non-empty regular file."
            exit 1
          fi

          case "$APK_PATH" in
            *.apk) ;;
            *)
              echo "::error::$APK_PATH does not have the .apk extension."
              exit 1
              ;;
          esac

          echo "Verified debug APK: $APK_PATH ($(wc -c < "$APK_PATH") bytes)"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          set -euo pipefail
          APK_SOURCE="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_SOURCE" ] || [ ! -s "$APK_SOURCE" ]; then
            echo "::error::Verified debug APK missing before release staging."
            exit 1
          fi

          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          SAFE_REPO="$(printf '%s' "$REPO_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g; s/^-+|-+$//g')"
          if [ -z "$SAFE_REPO" ]; then
            SAFE_REPO="pal-runner-3d"
          fi

          STAGE_DIR="${RUNNER_TEMP}/apk-release-asset"
          mkdir -p "$STAGE_DIR"
          ASSET_NAME="${SAFE_REPO}-debug-build-${{ github.run_number }}.apk"
          ASSET_PATH="${STAGE_DIR}/${ASSET_NAME}"

          cp "$APK_SOURCE" "$ASSET_PATH"

          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "::error::Failed to stage release APK asset at $ASSET_PATH"
            exit 1
          fi

          echo "asset_name=${ASSET_NAME}" >> "$GITHUB_OUTPUT"
          echo "asset_path=${ASSET_PATH}" >> "$GITHUB_OUTPUT"
          echo "Staged release asset: ${ASSET_NAME} ($(wc -c < "$ASSET_PATH") bytes)"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh --version

          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "::error::Release APK asset missing or empty: $ASSET_PATH"
            exit 1
          fi

          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          NOTES=$(cat <<EOF
          Auto-generated **debug APK** built via GitHub Actions.

          - **App:** Pal Runner 3D (Capacitor Android)
          - **Run:** #${{ github.run_number }} (attempt ${{ github.run_attempt }})
          - **Commit:** \`${{ github.sha }}\`
          - **Asset:** \`${ASSET_NAME}\`

          > **Testing Only:** This APK is signed with a temporary workflow-generated debug keystore and is intended for direct Android device testing only (not for Google Play Store production distribution).
          EOF
          )

          RELEASE_URL="$(gh release create "$TAG_NAME" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --target "${{ github.sha }}" \
            --latest \
            --notes "$NOTES")"

          echo "release_tag=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "release_title=${RELEASE_TITLE}" >> "$GITHUB_OUTPUT"
          echo "release_url=${RELEASE_URL}" >> "$GITHUB_OUTPUT"

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            TAG_NAME="${{ steps.publish_release.outputs.release_tag }}"
            if gh release view "$TAG_NAME" >/dev/null 2>&1; then
              {
                echo "## Pal Runner 3D — Android Debug APK Build"
                echo ""
                echo "- **Status:** Debug APK built and published to GitHub Releases"
                echo "- **Release Title:** ${{ steps.publish_release.outputs.release_title }}"
                echo "- **Release Tag:** \`${TAG_NAME}\`"
                echo "- **APK Asset:** \`${{ steps.prepare_asset.outputs.asset_name }}\`"
                echo "- **Release URL:** ${{ steps.publish_release.outputs.release_url }}"
                echo "- **Workflow Artifact (backup):** \`app-debug-apk\`"
              } >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::warning::Release step succeeded but verification via gh release view failed."
              {
                echo "## Pal Runner 3D — Android Debug APK Build"
                echo ""
                echo "- **Status:** Debug APK artifact uploaded (\`app-debug-apk\`); release verification failed."
                echo "- **Download Backup:** Download \`app-debug-apk\` from this workflow run's Artifacts section."
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "::warning::GitHub Release publishing failed; the debug APK is still available as a workflow artifact."
            {
              echo "## Pal Runner 3D — Android Debug APK Build"
              echo ""
              echo "- **Status:** Debug APK built and uploaded as workflow artifact only."
              echo "- **Download Backup:** Download \`app-debug-apk\` from this workflow run's Artifacts section."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
