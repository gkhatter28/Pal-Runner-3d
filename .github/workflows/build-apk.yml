name: Build Release & Debug APKs

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release-apk:
    name: Build Signed Release APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install web dependencies & sync Capacitor Android
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund
          npm run build
          npx cap sync android

      - name: Set up Temurin Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Verify Java Version
        run: |
          java -version
          javac -version
          echo $JAVA_HOME

      - name: Set up Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Ensure Android SDK licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ -d "$SDK_DIR" ] && [ -x "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_DIR" --licenses >/dev/null 2>&1 || true
          fi

      - name: Check release keystore secrets
        id: keystore_check
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASS" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASS" ]; then
            KEYSTORE_FILE="${RUNNER_TEMP}/palrunner-release.jks"
            CLEAN_B64="$(printf '%s' "$KEYSTORE_B64" | tr -d "\r\"'" | sed -E '/^[[:space:]]*-----BEGIN/d; /^[[:space:]]*-----END/d' | tr -d '[:space:]')"
            if ! printf '%s' "$CLEAN_B64" | base64 --decode > "$KEYSTORE_FILE" 2>/dev/null || [ ! -s "$KEYSTORE_FILE" ]; then
              echo "::error::Decoded release keystore is invalid or empty. Verify ANDROID_KEYSTORE_BASE64 / KEYSTORE_BASE64."
              exit 1
            fi
            set +e
            LIST_OUT="$("${JAVA_HOME}/bin/keytool" -list -keystore "$KEYSTORE_FILE" -storepass "$KEYSTORE_PASS" 2>&1)"
            LIST_EXIT=$?
            set -e
            if [ "$LIST_EXIT" -ne 0 ]; then
              echo "::error::Keystore unreadable or store password is incorrect."
              echo "$LIST_OUT"
              exit 1
            fi
            set +e
            ALIAS_OUT="$("${JAVA_HOME}/bin/keytool" -list -keystore "$KEYSTORE_FILE" -storepass "$KEYSTORE_PASS" -alias "$KEY_ALIAS" 2>&1)"
            ALIAS_EXIT=$?
            set -e
            if [ "$ALIAS_EXIT" -ne 0 ]; then
              echo "::error::Key alias not found in keystore."
              echo "$ALIAS_OUT"
              printf '%s\n' "$LIST_OUT" | grep -E "PrivateKeyEntry|SecretKeyEntry" || true
              exit 1
            fi
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "keystore_path=${KEYSTORE_FILE}" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Release signing secrets (ANDROID_KEYSTORE_BASE64/KEYSTORE_BASE64, PASSWORD, ALIAS, KEY_PASSWORD) are not all set. Skipping signed release build; building internal test debug APK only."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build signed Release APK & AAB
        if: steps.keystore_check.outputs.configured == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore_check.outputs.keystore_path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || secrets.KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease :app:bundleRelease --stacktrace --no-daemon

      - name: Verify Release APK & AAB signatures
        if: steps.keystore_check.outputs.configured == 'true'
        run: |
          set -euo pipefail
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
          AAB_PATH="android/app/build/outputs/bundle/release/app-release.aab"

          if [ ! -f "$APK_PATH" ] || [ ! -s "$APK_PATH" ]; then
            echo "::error::Signed release APK missing at $APK_PATH"
            exit 1
          fi
          if [ ! -f "$AAB_PATH" ] || [ ! -s "$AAB_PATH" ]; then
            echo "::error::Signed release AAB missing at $AAB_PATH"
            exit 1
          fi

          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          BUILD_TOOLS_DIR="$(find "$SDK_DIR/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"

          if [ -x "$BUILD_TOOLS_DIR/apksigner" ]; then
            "$BUILD_TOOLS_DIR/apksigner" verify --verbose --print-certs "$APK_PATH"
          fi

          if [ -x "$BUILD_TOOLS_DIR/aapt2" ]; then
            BADGING="$("$BUILD_TOOLS_DIR/aapt2" dump badging "$APK_PATH")"
            printf '%s\n' "$BADGING" | head -n 5
            if printf '%s\n' "$BADGING" | grep -q "application-debuggable"; then
              echo "::error::Release APK must NOT be marked application-debuggable!"
              exit 1
            fi
          fi

          AAB_VERIFY="$("${JAVA_HOME}/bin/jarsigner" -verify -certs "$AAB_PATH")"
          echo "$AAB_VERIFY"
          if ! printf '%s\n' "$AAB_VERIFY" | grep -q "jar verified"; then
            echo "::error::AAB signature verification failed!"
            exit 1
          fi

          echo "Verified signed release APK: $APK_PATH ($(wc -c < "$APK_PATH") bytes)"
          echo "Verified signed release AAB: $AAB_PATH ($(wc -c < "$AAB_PATH") bytes)"

      - name: Upload signed Release APK artifact
        if: steps.keystore_check.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload signed Release AAB artifact
        if: steps.keystore_check.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Stage & publish signed Release APK & AAB to GitHub Releases
        if: steps.keystore_check.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK_SOURCE="android/app/build/outputs/apk/release/app-release.apk"
          AAB_SOURCE="android/app/build/outputs/bundle/release/app-release.aab"
          APK_ASSET="${RUNNER_TEMP}/pal-runner-3d-v1.0.1-release-${{ github.run_number }}.apk"
          AAB_ASSET="${RUNNER_TEMP}/pal-runner-3d-v1.0.1-release-${{ github.run_number }}.aab"
          cp "$APK_SOURCE" "$APK_ASSET"
          cp "$AAB_SOURCE" "$AAB_ASSET"

          TAG_NAME="release-v1.0.1-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Pal Runner 3D v1.0.1 (Release Build #${{ github.run_number }})"
          NOTES_FILE="${RUNNER_TEMP}/release-notes.md"
          cat <<'EOF' | sed "s/^          //; s/__SHA__/${{ github.sha }}/" > "$NOTES_FILE"
          Signed **Release APK** (for Uptodown & direct markets) and **Release AAB** (for Google Play Store) built via GitHub Actions.

          - **App:** Pal Runner 3D (`com.palrunner3d.app`)
          - **Version:** `1.0.1` (`versionCode 2`)
          - **Commit:** `__SHA__`
          - **Verified:** Signed with repository release keystore (`apksigner` & `jarsigner`), `application-debuggable` absent.
          EOF

          gh release create "$TAG_NAME" "$APK_ASSET" "$AAB_ASSET" \
            --title "$RELEASE_TITLE" \
            --target "${{ github.sha }}" \
            --latest \
            --notes-file "$NOTES_FILE"

      - name: Build internal testing Debug APK (fallback when release secrets missing)
        if: steps.keystore_check.outputs.configured != 'true'
        working-directory: android
        run: |
          set -euo pipefail
          if [ ! -f ./debug.keystore ]; then
            "${JAVA_HOME}/bin/keytool" -genkeypair \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 >/dev/null 2>&1
          fi
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Upload internal testing Debug APK artifact
        if: steps.keystore_check.outputs.configured != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk-testing-only
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Write workflow summary
        if: always()
        run: |
          if [ "${{ steps.keystore_check.outputs.configured }}" = "true" ]; then
            {
              echo "## Pal Runner 3D — Signed Release APK & AAB"
              echo ""
              echo "- **Status:** Signed Release APK & AAB built, signature-verified, and published."
              echo "- **APK Artifact (Uptodown / Markets):** \`app-release-apk\` (\`app-release.apk\`)"
              echo "- **AAB Artifact (Google Play):** \`app-release-aab\` (\`app-release.aab\`)"
              echo "- **Package:** \`com.palrunner3d.app\` (version \`1.0.1\`, versionCode \`2\`)"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## Pal Runner 3D — Release Signing Secrets Required"
              echo ""
              echo "A **debug APK** was built for internal testing only (do NOT submit debug APKs to markets)."
              echo ""
              echo "To generate and publish the signed **Release APK & AAB**, configure these 4 GitHub Repository Secrets:"
              echo "- \`ANDROID_KEYSTORE_BASE64\`"
              echo "- \`ANDROID_KEYSTORE_PASSWORD\`"
              echo "- \`ANDROID_KEY_ALIAS\`"
              echo "- \`ANDROID_KEY_PASSWORD\`"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
