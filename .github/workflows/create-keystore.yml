name: Create Release Keystore

on:
  workflow_dispatch:

jobs:
  create-keystore:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Generate Keystore
        env:
          STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD || secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "$STORE_PASS" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::Set KEYSTORE_PASSWORD and KEY_ALIAS in GitHub Repository Secrets before running this workflow."
            exit 1
          fi
          if [ "${#STORE_PASS}" -lt 6 ]; then
            echo "::error::KEYSTORE_PASSWORD must be at least 6 characters for keytool."
            exit 1
          fi
          if [ -z "$KEY_PASS" ]; then
            KEY_PASS="$STORE_PASS"
          fi
          if [ "${#KEY_PASS}" -lt 6 ]; then
            echo "::error::KEY_PASSWORD must be at least 6 characters for keytool."
            exit 1
          fi

          # Java 21 defaults to PKCS12 which ignores a different -keypass; use JKS only if passwords differ
          STORE_TYPE="PKCS12"
          if [ "$STORE_PASS" != "$KEY_PASS" ]; then
            STORE_TYPE="JKS"
          fi

          keytool -genkeypair -v \
            -storetype "$STORE_TYPE" \
            -keystore pal-runner-release.jks \
            -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" \
            -alias "$KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Pal Runner, OU=Gaming, O=Pal Runner, L=Tosham, ST=Haryana, C=IN"

          base64 -w 0 pal-runner-release.jks > keystore-base64.txt
          echo "Generated $STORE_TYPE keystore and encoded keystore-base64.txt ($(wc -c < keystore-base64.txt) bytes)."

      - name: Upload Keystore Base64
        uses: actions/upload-artifact@v4
        with:
          name: keystore-base64
          path: keystore-base64.txt
          retention-days: 1
